name: Verify Secret
on: [push, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check TMDB_API_KEY is set
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "TMDB_API_KEY is NOT set"
            exit 1
          else
            echo "TMDB_API_KEY is set (length: ${#TMDB_API_KEY} characters, never printing the value)"
          fi
